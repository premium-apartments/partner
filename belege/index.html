<style>

  --ci-greige:#DBD7D3; --ci-greige2:#C1BCB6; --ci-taupe:#7E715E; --ci-black:#2B2B2A;
  --ground:var(--ci-greige2); --cream:var(--ci-greige); --paper:#FFFFFF; --line:#D6D1CB; --ink:var(--ci-black); --muted:#5C5852;

  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}

p{margin:0}

.top h1{font-size:21px;line-height:1.1}
.top .wer{margin-left:auto;text-align:right;font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--gold);line-height:1.3;min-width:0}

.sec .lbl{color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}

.muted{color:var(--muted)}
.klein-t{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.stack{display:flex;flex-direction:column;gap:10px}

.btn.warn{border-color:var(--err);color:var(--err)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px}
.btn.block{width:100%}
.btn.cta{min-height:78px;font-size:19px;letter-spacing:.08em}
.btn:disabled{opacity:.45;cursor:default}

.tag.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.tag.warn{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}

#toast.show{opacity:1;transform:none}
.dots::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.hint{font-size:13.5px;color:var(--muted)}
.mehr{background:none;border:0;padding:6px 0;color:var(--gold);font-family:var(--cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;cursor:pointer;text-align:left}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:'…'}#toast{transition:none}}

</style>

  </div></nav>

      h('button', { class: 'btn pri block', type: 'button', id: 'bAblegen', disabled: S.busy, onclick: function () { speichern(true); }, text: 'Bestätigen und ablegen' }),
      h('button', { class: 'btn block', type: 'button', id: 'bSpeichern', disabled: S.busy, onclick: function () { speichern(false); }, text: 'Nur speichern' })));
    if (!S.confirmDel) out.push(h('button', { class: 'btn warn block', type: 'button', id: 'bStorno', onclick: function () { S.confirmDel = true; render(); }, text: 'Beleg stornieren' }));
    else out.push(h('div', { class: 'banner err' }, h('span', { text: 'Diesen Beleg wirklich stornieren? Er wird nicht verbucht.' }),
      h('div', { class: 'row' }, h('button', { class: 'btn warn sm', type: 'button', id: 'bStornoJa', disabled: S.busy, onclick: stornieren, text: 'Ja, stornieren' }), h('button', { class: 'btn ghost sm', type: 'button', onclick: function () { S.confirmDel = false; render(); }, text: 'Abbrechen' }))));

}
function speichern(best) {
  var b = bel(S.sel), e = S.edit; if (!b || S.busy) return;
  S.busy = true; S.msg = ''; S.fehlerFelder = {}; render();
  api({ a: 'speichern', belegId: b.belegId, bestaetigen: !!best, felder: { haendler: e.haendler, datum: e.datum, betrag: e.betrag, ust: e.ust, steuer: e.steuer, belegnr: e.belegnr, firma: e.firma, zahlart: e.zahlart, kategorie: e.kategorie, objekt: e.objekt, notiz: e.notiz } }).then(function (r) {
    S.busy = false;
    if (r.ok) { if (r.beleg) belegMerge(r.beleg); S.editDirty = false; S.v = S.zurueck || 'liste'; render(); toast(best ? 'Abgelegt – landet im Dashboard.' : 'Gespeichert.'); return; }
    if (r.code === 'netz') S.msg = 'Keine Verbindung – bitte später noch einmal speichern.';

      S.msg = r.fehler || 'Das hat nicht geklappt.';

}
function stornieren() {
  var b = bel(S.sel); if (!b || S.busy) return;
  S.busy = true; render();
  api({ a: 'loeschen', belegId: b.belegId }).then(function (r) {
    S.busy = false;
    if (r.ok) { S.belege = S.belege.filter(function (x) { return x.belegId !== b.belegId; }); S.v = S.zurueck || 'liste'; S.confirmDel = false; render(); toast('Beleg storniert.'); return; }

  });
}

/* ---------- Ansicht: Foto in der Warteschlange ---------- */
function vQDetail() {
  var q = null, i;
  for (i = 0; i < S.queue.length; i++) if (S.queue[i].cid === S.sel) q = S.queue[i];
  if (!q) { S.v = 'liste'; return vListe(); }
  var out = [h('div', { class: 'row sp' }, h('button', { class: 'btn sm ghost', type: 'button', onclick: function () { S.v = 'liste'; render(); }, text: '‹ Zurück' }), h('span', { class: 'tag ' + tagVon({ queued: true, q: q }).c, text: tagVon({ queued: true, q: q }).t }))];
  if (q.thumb) out.push(h('div', { class: 'prev', style: 'max-height:260px' }, h('img', { src: q.thumb, alt: 'Foto', style: 'max-height:260px' })));
  if (q.fehler) out.push(h('div', { class: 'banner ' + (q.status === 'fehler' ? 'err' : 'warn') }, h('span', { text: q.fehler })));
  else out.push(h('div', { class: 'banner' }, h('span', { text: S.online ? 'Das Foto wird gleich gesendet.' : 'Das Foto wird gesendet, sobald du wieder online bist.' })));
  out.push(h('div', { class: 'stack' },
    h('button', { class: 'btn pri block', type: 'button', id: 'bNochmal', onclick: function () { q.status = 'wartet'; q.fehler = ''; qSpeichern(q).then(function () { S.v = 'liste'; render(); sendeQueue(); }); }, text: 'Jetzt senden' }),
    S.confirmDel ? h('div', { class: 'banner err' }, h('span', { text: 'Foto wirklich verwerfen? Es wird nicht gesendet.' }), h('div', { class: 'row' }, h('button', { class: 'btn warn sm', type: 'button', id: 'bVerwerfenJa', onclick: function () { qEntfernen(q.cid).then(function () { S.confirmDel = false; S.v = 'liste'; render(); toast('Foto verworfen.'); }); }, text: 'Ja, verwerfen' }), h('button', { class: 'btn ghost sm', type: 'button', onclick: function () { S.confirmDel = false; render(); }, text: 'Abbrechen' })))
      : h('button', { class: 'btn warn block', type: 'button', id: 'bVerwerfen', onclick: function () { S.confirmDel = true; render(); }, text: 'Foto verwerfen' })));
  return out;
}

/* ---------- Ansicht: Info ---------- */
function vInfo() {
  var out = [testBanner()];
  out.push(h('div', { class: 'card' }, h('span', { class: 'lbl', text: 'Dieses Gerät' }),
    h('dl', { class: 'kv' },
      h('dt', { text: 'Angemeldet als' }), h('dd', { text: S.person ? S.person.name : '–' }),
      h('dt', { text: 'Verbindung' }), h('dd', { text: S.online ? 'online' : 'offline' }),
      h('dt', { text: 'Wartende Fotos' }), h('dd', { text: String(S.queue.length) }),
      h('dt', { text: 'Version' }), h('dd', { text: VER }))));
  out.push(h('div', { class: 'card' }, h('span', { class: 'lbl', text: 'So geht’s' }),
    h('p', { class: 'klein-t', text: 'Unter „Neu“ den Beleg fotografieren, Firma und Zahlart antippen, senden. Das Foto wird abgelegt und automatisch gelesen; danach landet der Beleg im Dashboard, wie bei Mail oder Scanner.' }),
    h('p', { class: 'klein-t', text: 'Ohne Netz bleibt das Foto auf dem Gerät und wird später automatisch gesendet.' }),
    h('p', { class: 'klein-t muted', text: 'PDF-Rechnungen bitte weiter per Mail oder Scanner senden.' })));
  out.push(h('div', { class: 'card' }, h('span', { class: 'lbl', text: 'Auf den Home-Bildschirm' }),
    h('p', { class: 'klein-t', text: 'iPhone: im Safari öffnen, Teilen, „Zum Home-Bildschirm“. Android: Browser-Menü, „Zum Startbildschirm hinzufügen“. Der Link ist persönlich – bitte nicht weitergeben.' })));
  out.push(h('div', { class: 'stack' },
    h('button', { class: 'btn block', type: 'button', id: 'bPruefen', onclick: function () { start(true); }, text: 'Verbindung prüfen' }),
    S.confirmReset ? h('div', { class: 'banner err' }, h('span', { text: 'Den Zugang von diesem Gerät entfernen? Wartende Fotos bleiben erhalten. Zum erneuten Anmelden brauchst du den Link aus dem Dashboard.' }), h('div', { class: 'row' }, h('button', { class: 'btn warn sm', type: 'button', id: 'bAbmeldenJa', onclick: abmelden, text: 'Ja, entfernen' }), h('button', { class: 'btn ghost sm', type: 'button', onclick: function () { S.confirmReset = false; render(); }, text: 'Abbrechen' })))
      : h('button', { class: 'btn ghost block', type: 'button', id: 'bAbmelden', onclick: function () { S.confirmReset = true; render(); }, text: 'Zugang von diesem Gerät entfernen' })));
  return out;
}
function abmelden() { ls(LS_T, null); ls(LS_CFG, null); S.token = ''; S.person = null; S.cfg = null; S.belege = []; S.confirmReset = false; S.fatal = { code: 'kein-link' }; render(); }

/* ---------- Ansicht: kein Zugang ---------- */
function vFatal() {
  var f = S.fatal || {}, t, d;
  if (f.code === 'kein-link') { t = 'Link fehlt'; d = 'Bitte den persönlichen Link aus dem Dashboard öffnen (Menü „Handy-Belege“). Er enthält deinen Zugang.'; }
  else if (f.code === 'zugang') { t = 'Link nicht mehr gültig'; d = 'Bitte im Dashboard einen neuen Link erzeugen und öffnen.'; }
  else if (f.code === 'aus') { t = 'Noch nicht freigeschaltet'; d = f.fehler || 'Die Beleg-App ist noch nicht freigeschaltet.'; }
  else { t = 'Keine Verbindung'; d = (f.fehler || 'Der Server ist gerade nicht erreichbar.') + ' Bitte später noch einmal öffnen.'; }
  var out = [h('div', { class: 'card', role: 'alert', 'data-t': 'fatal' }, h('h2', { text: t }), h('p', { class: 'muted', text: d }),
    f.code === 'offline-leer' || f.code === 'zugang' || f.code === 'aus' ? h('button', { class: 'btn block', type: 'button', onclick: function () { S.fatal = null; S.loading = true; render(); start(); }, text: 'Noch einmal versuchen' }) : null)];
  if (S.queue.length) out.push(h('div', { class: 'banner warn' }, h('span', { text: S.queue.length + (S.queue.length === 1 ? ' Foto ist' : ' Fotos sind') + ' auf diesem Gerät gespeichert und gehen verloren, wenn die App gelöscht wird.' })));
  return out;
}

/* ---------- Anzeige ---------- */
function updateKopf() {
  var w = $('#wer'); if (!w) return;
  leer(w); w.appendChild(h('b', { text: S.person ? S.person.name : '' })); w.appendChild(h('span', { class: S.online ? '' : 'off', text: S.online ? 'Online' : 'Offline' }));
  var n = S.queue.length, bd = $('#bdQ');
  if (bd) { bd.textContent = String(n); bd.hidden = !n; }
  Array.prototype.forEach.call(document.querySelectorAll('nav button[data-v]'), function (b) {
    var v = b.getAttribute('data-v'), akt = (S.v === v) || (v === 'liste' && (S.v === 'detail' || S.v === 'qdetail'));
    b.classList.toggle('on', akt); if (akt) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}
function render() {
  var m = $('#main'); if (!m) return;
  updateKopf();
  var nav = $('nav'); if (nav) nav.hidden = !!S.fatal;
  leer(m);
  var inhalt;
  if (S.fatal) inhalt = vFatal();
  else if (S.loading) inhalt = [h('div', { class: 'card klein' }, h('span', { class: 'dots muted', text: 'Wird geladen' }))];
  else if (S.v === 'liste') inhalt = vListe();
  else if (S.v === 'detail') inhalt = vDetail();
  else if (S.v === 'qdetail') inhalt = vQDetail();
  else if (S.v === 'info') inhalt = vInfo();
  else inhalt = vNeu();
  (Array.isArray(inhalt) ? inhalt : [inhalt]).forEach(function (x) { if (x) m.appendChild(x); });
}
// sanft: Eingaben nicht stören
function renderSoft() {
  if (S.v === 'detail') {
    var b = bel(S.sel);
    if (b && !S.editDirty && !S.busy) { S.edit = editVon(b); render(); } else updateKopf();
    return;
  }
  if (S.v === 'neu' && S.draft) { updateKopf(); return; }
  render();
}
function wechsle(v) {
  if (S.draft && v !== 'neu') { /* Entwurf bleibt erhalten */ }
  S.v = v; S.msg = ''; S.confirmDel = false; S.confirmReset = false; S.zurueck = v === 'neu' ? 'neu' : 'liste'; render(); window.scrollTo(0, 0);
  if (v === 'liste') lade(true);
}

/* ---------- Laden ---------- */
function lade(still) {
  if (!S.online || !S.token || S.fatal) return Promise.resolve();
  return api({ a: 'liste' }).then(function (r) {
    if (r.ok) {
      S.belege = r.belege || []; if (r.config) { S.cfg = r.config; ls(LS_CFG, JSON.stringify({ cfg: r.config, person: S.person, test: S.test })); }
      S.belege.forEach(beobachte); renderSoft();
    } else if (r.code === 'zugang' || r.code === 'aus') { S.fatal = r; render(); }
    else if (!still) toast(r.code === 'netz' ? 'Keine Verbindung.' : (r.fehler || 'Aktualisieren hat nicht geklappt.'));
  });
}
function start(zeigen) {
  return api({ a: 'start' }).then(function (r) {
    if (r.ok) {
      S.cfg = r.config; S.person = r.person; S.test = !!r.test; S.belege = r.belege || []; S.fatal = null;
      ls(LS_CFG, JSON.stringify({ cfg: r.config, person: r.person, test: !!r.test }));
      S.belege.forEach(beobachte);
      if (zeigen) toast('Verbindung in Ordnung.');
    } else if (r.code === 'zugang' || r.code === 'aus') S.fatal = r;
    else if (!S.cfg) S.fatal = { code: 'offline-leer', fehler: r.fehler || 'Keine Verbindung.' };
    else if (zeigen) toast(r.code === 'netz' ? 'Keine Verbindung.' : (r.fehler || 'Der Server antwortet nicht.'));
    S.loading = false; render();
  });
}
function tokenLesen() {
  var m = /[#&?]t=([0-9a-fA-F]{24,64})(?![0-9a-fA-F])/.exec(location.hash || ''), t = m ? m[1].toLowerCase() : '';
  if (t) { ls(LS_T, t); return t; }
  var g = ls(LS_T); return g && /^[0-9a-f]{24,64}$/.test(g) ? g : '';
}

/* ---------- Start ---------- */
function init() {
  S.token = tokenLesen();
  var c = jp(ls(LS_CFG), null); if (c && c.cfg) { S.cfg = c.cfg; S.person = c.person || null; S.test = !!c.test; }
  var fc = $('#fCam'), fp = $('#fPick');
  [fc, fp].forEach(function (inp) { inp.addEventListener('change', function () { var f = inp.files && inp.files[0]; inp.value = ''; if (f) dateiGewaehlt(f); }); });
  Array.prototype.forEach.call(document.querySelectorAll('nav button[data-v]'), function (b) { b.addEventListener('click', function () { wechsle(b.getAttribute('data-v')); }); });
  window.addEventListener('online', function () { S.online = true; updateKopf(); sendeQueue(); lade(true); });
  window.addEventListener('offline', function () { S.online = false; renderSoft(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { S.online = navigator.onLine !== false; sendeQueue(); lade(true); } });
  setInterval(function () { if (S.online && !S.sending && S.queue.some(function (q) { return q.status === 'wartet'; })) sendeQueue(); }, 25000);
  dbOpen().then(function (d) { DB = d; return Promise.all([dbAll('queue'), dbAll('thumbs')]); }).then(function (x) {
    S.queue = x[0].map(function (q) { q.status = q.status === 'fehler' ? 'fehler' : 'wartet'; return q; }).sort(function (a, b) { return String(a.erstellt) > String(b.erstellt) ? 1 : -1; });
    var jetzt = Date.now();
    x[1].forEach(function (t) { if (jetzt - (t.t || 0) > 60 * 86400000) dbDel('thumbs', t.cid); else S.thumbs[t.cid] = t.thumb; });
    if (!S.token) { S.fatal = { code: 'kein-link' }; S.loading = false; render(); return null; }
    render();
    return start().then(function () { return sendeQueue(); });
  });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').then(function () { S.swOk = true; }).catch(function () { /* ohne Offline-Hülle */ }); } catch (e) { /* */ } }
}

init();
})();
