<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#DBD7D3">
<title>Team-App Anleitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto+Condensed:wght@500;700&display=swap&subset=cyrillic">
<style>
/* Klick-Anleitung im Stil der Team-App: helles Greige, weiße Karte, Telefonrahmen; ein Schritt pro Ansicht, unten Navigation. */
:root{
  --bg:#DBD7D3;        /* CI helles Greige – Hintergrund wie in der App */
  --card:#FFFFFF;      /* Karten */
  --bar:#C1BCB6;       /* CI dunkleres Greige – Leisten */
  --ink:#2B2B2A;       /* CI Schwarz – Text */
  --muted:#5C5852;
  --line:#CFC9C2;
  --accent:#7E715E;    /* CI warmes Taupe – sparsame Akzente */
  --accent-ink:#FFFFFF;
  --frame:#2B2B2A;     /* Telefonrahmen */
  --tipbg:#F4F1EC;
  --dim:rgba(43,43,42,.42);
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --label:'DIN Condensed','DIN OT Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --body:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1D1B;--card:#2A2826;--bar:#33302D;--ink:#EDEAE6;--muted:#B3ADA5;--line:#403D39;--accent:#B8A88F;--accent-ink:#1E1D1B;--frame:#0F0F0E;--tipbg:#25231F;--dim:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1D1B;--card:#2A2826;--bar:#33302D;--ink:#EDEAE6;--muted:#B3ADA5;--line:#403D39;--accent:#B8A88F;--accent-ink:#1E1D1B;--frame:#0F0F0E;--tipbg:#25231F;--dim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,li:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);display:flex;align-items:center;gap:10px;padding:8px 16px}
.top .mark{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;padding:0;text-align:left}
.top img{height:30px;width:auto;flex:none;background:#fff;border-radius:6px;padding:3px 5px}
.top .nm{font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid var(--line);background:var(--card);flex:none}
.lang button{border:0;background:none;padding:6px 10px;font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.05em}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
main{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1,h2{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,44px);line-height:1.12}
h2{font-size:clamp(24px,4.6vw,32px);line-height:1.18}
p{margin:0}
/* Start */
.start{display:grid;gap:22px;max-width:680px;margin:0 auto}
.start .hero{background:var(--card);padding:26px 22px;display:grid;gap:12px}
.start .hero img{width:150px;height:auto}
.start .sub{color:var(--muted);font-size:17px}
.start .meta{font-size:14px;color:var(--muted)}
.how{display:grid;gap:8px;font-size:15px}
.how p{display:flex;gap:10px;align-items:flex-start}
.how .n{flex:none}
.toc{display:grid;gap:8px;counter-reset:k}
.toc button{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid transparent;padding:12px 14px}
.toc button:hover{border-color:var(--accent)}
.toc .kn{font-family:var(--display);font-size:24px;color:var(--accent);text-align:center}
.toc .kt{font-weight:600;min-width:0}
.toc .kc{font-family:var(--label);font-size:13px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.go{justify-self:start;background:var(--ink);color:var(--card);border:0;padding:14px 22px;font-family:var(--label);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
/* Schritt */
.step{display:grid;gap:18px}
.head{display:grid;gap:6px}
.prog{display:flex;align-items:center;gap:10px;font-family:var(--label);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{flex:1;height:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.body{display:grid;gap:18px}
.lead{font-size:17px}
.shotwrap{display:flex;justify-content:center}
.phone{background:var(--frame);border-radius:30px;padding:9px;box-shadow:0 10px 30px rgba(43,43,42,.18);width:min(100%,calc((58vh - 18px) * 390 / 844 + 18px));max-width:340px;touch-action:pan-y}
.screen{position:relative;border-radius:22px;overflow:hidden;line-height:0;cursor:zoom-in}
.screen img{width:100%;height:auto;aspect-ratio:390/844;display:block;background:#DBD7D3}
.mk{position:absolute;width:26px;height:26px;border-radius:50%;background:#2B2B2A;color:#fff;font:700 14px/26px var(--body);text-align:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35);border:0;padding:0;z-index:3;cursor:pointer}
.mk.on{background:#7E715E;transform:scale(1.12)}
.spot{position:absolute;border:3px solid #7E715E;border-radius:8px;box-shadow:0 0 0 2000px var(--dim);z-index:2;pointer-events:none;transition:all .2s}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pts li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--card);padding:12px 14px;border:2px solid transparent;cursor:pointer}
.pts li.on{border-color:var(--accent)}
.n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--card);font:700 14px/26px var(--body);text-align:center}
.pts li.on .n{background:var(--accent);color:var(--accent-ink)}
.tip{background:var(--tipbg);border-left:4px solid var(--accent);padding:12px 14px;display:grid;gap:2px}
.tip b{font-family:var(--label);letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.textpage{display:grid;gap:10px;max-width:680px}
.textpage .it{background:var(--card);padding:14px 16px;display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start}
.textpage .it::before{content:"";width:10px;height:10px;margin-top:7px;background:var(--accent);border-radius:50%}
@media (min-width:900px){
  .body{grid-template-columns:minmax(300px,380px) minmax(0,1fr);align-items:start;gap:34px}
  .phone{width:min(100%,calc((100vh - 318px) * 390 / 844 + 18px));min-width:240px;max-width:380px;position:sticky;top:80px}
  .shotwrap{justify-content:flex-start}
}
/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px max(16px,calc((100% - 1008px) / 2)) calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{border:1px solid var(--ink);background:var(--card);padding:12px 10px;font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
.nav .nx{background:var(--ink);color:var(--card)}
.nav .tc{border-color:var(--line)}
.nav button:disabled{opacity:.35;cursor:default}
/* Großansicht */
.zoom{position:fixed;inset:0;z-index:50;background:rgba(20,19,18,.92);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.zoom .z{position:relative;height:100%;max-height:100%;aspect-ratio:390/844;max-width:100%}
.zoom img{width:100%;height:100%;object-fit:contain;border-radius:18px}
.zoom .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:#fff;color:#2B2B2A;border:0;padding:10px 14px;font-family:var(--label);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <button class="mark" id="home" type="button"><img id="logo" alt="Premium Apartments Seekirchen"><span class="nm" id="appname">Anleitung</span></button>
  <div class="lang" role="group" aria-label="Sprache"><button type="button" data-l="de" aria-pressed="true">Deutsch</button><button type="button" data-l="bg" aria-pressed="false">Български</button></div>
</div>
<main id="main"></main>
<nav class="nav" id="nav" hidden>
  <button type="button" id="prev"></button>
  <button type="button" class="tc" id="toc"></button>
  <button type="button" class="nx" id="next"></button>
</nav>
<script>
var DATA = {"stand": "09.10.2026", "titel": {"de": "So funktioniert die Team-App", "bg": "Как работи приложението за екипа"}, "untertitel": {"de": "Anleitung für das Reinigungsteam – Schritt für Schritt", "bg": "Ръководство за екипа по почистване – стъпка по стъпка"}, "hinweisBeispiel": {"de": "Alle Bilder zeigen Beispieldaten (erfundene Namen und Buchungen).", "bg": "Всички снимки показват примерни данни (измислени имена и резервации)."}, "kapitel": [{"id": "k1", "t": {"de": "Erste Schritte", "bg": "Първи стъпки"}, "steps": [{"id": "s00", "bild": "chrome_menu", "t": {"de": "Android: App öffnen und auf den Startbildschirm legen", "bg": "Android: отвори приложението и го сложи на началния екран"}, "i": {"de": "Den Link (oder QR-Code) bekommst du von Nina oder Rene. Öffne ihn in Chrome. Samsung: Öffnet sich der Link in „Samsung Internet“, den Link kopieren und in Chrome einfügen.", "bg": "Линка (или QR кода) получаваш от Nina или Rene. Отвори го в Chrome. Samsung: ако линкът се отвори в „Samsung Internet“, копирай го и го постави в Chrome."}, "p": [{"de": "Oben rechts auf ⋮ tippen – das Menü von Chrome.", "bg": "Натисни ⋮ горе вдясно – менюто на Chrome."}, {"de": "„App installieren“ bzw. „Zum Startbildschirm hinzufügen“ tippen und bestätigen. Ab jetzt öffnest du die App über das Symbol „PA Team“ – wie jede andere App.", "bg": "Натисни „Инсталиране на приложението“ или „Добавяне към началния екран“ и потвърди. Отсега отваряш приложението от иконата „PA Team“ – като всяко друго приложение."}], "tipp": {"de": "Vereinfachte Darstellung – je nach Handy sieht das Menü etwas anders aus. iPhone: nächster Schritt.", "bg": "Опростено изображение – според телефона менюто изглежда малко различно. iPhone: следващата стъпка."}}, {"id": "s00b", "bild": "safari_teilen", "t": {"de": "iPhone: auf den Home-Bildschirm legen", "bg": "iPhone: сложи го на началния екран"}, "i": {"de": "Am iPhone den Link in Safari öffnen. Wichtig: Benachrichtigungen kommen am iPhone nur, wenn du die App über ihr Symbol am Home-Bildschirm öffnest.", "bg": "На iPhone отвори линка в Safari. Важно: на iPhone известията идват само ако отваряш приложението от иконата му на началния екран."}, "p": [{"de": "In Safari auf ••• rechts neben der Adresse tippen → „Teilen“. (Ältere iPhones: direkt das Teilen-Symbol □↑ unten.)", "bg": "В Safari натисни ••• вдясно от адреса → „Сподели“ (Share). (По-стари iPhone: направо символа за споделяне □↑ долу.)"}, {"de": "„Zum Home-Bildschirm“ tippen – „Als Web-App öffnen“ eingeschaltet lassen – „Hinzufügen“. Ab jetzt die App nur noch über das Symbol „PA Team“ öffnen.", "bg": "Натисни „Добави към началния екран“ (Add to Home Screen) – остави „Отваряне като уеб приложение“ включено – „Добави“. Отсега отваряй приложението само от иконата „PA Team“."}], "tipp": {"de": "Vereinfachte Darstellung. Ein Fokus (z. B. „Arbeiten“ oder „Nicht stören“) schaltet Mitteilungen stumm – dann unter Einstellungen › Fokus die App „PA Team“ erlauben.", "bg": "Опростено изображение. „Фокус“ (напр. „Работа“ или „Не безпокойте“) заглушава известията – тогава разреши приложението „PA Team“ в Настройки › Фокус."}}, {"id": "s01", "bild": "login", "t": {"de": "App öffnen und anmelden", "bg": "Отвори приложението и влез"}, "i": {"de": "Öffne die App über das Symbol „PA Team“.", "bg": "Отвори приложението от иконата „PA Team“."}, "p": [{"de": "Tippe auf deinen Namen.", "bg": "Натисни името си."}, {"de": "Sprache wählen: Deutsch, Български oder English. Die App merkt sich deine Wahl.", "bg": "Избери език: Deutsch, Български или English. Приложението запомня избора ти."}, {"de": "Tipp: Im Browser „Teilen“ → „Zum Home-Bildschirm“. Dann öffnest du die App wie jede andere App am Handy.", "bg": "Съвет: в браузъра „Сподели“ → „Към началния екран“. Така отваряш приложението като всяко друго приложение на телефона."}]}, {"id": "s02", "bild": "pin", "t": {"de": "PIN eingeben", "bg": "Въведи PIN"}, "p": [{"de": "Dein Name ist markiert.", "bg": "Името ти е маркирано."}, {"de": "Die Punkte zeigen, wie viele Ziffern du schon getippt hast.", "bg": "Точките показват колко цифри вече си въвела."}, {"de": "Gib deine 6-stellige PIN ein. Nach der 6. Ziffer bist du automatisch angemeldet.", "bg": "Въведи своя 6-цифрен PIN. След 6-ата цифра влизаш автоматично."}], "tipp": {"de": "Deine PIN bekommst du persönlich. Ändern kannst du sie unter „Ich“.", "bg": "PIN кода получаваш лично. Можеш да го смениш в „Аз“."}}, {"id": "s02a", "bild": "push_banner", "t": {"de": "Benachrichtigungen einschalten", "bg": "Включи известията"}, "i": {"de": "Damit neue Anweisungen sofort ankommen – auch wenn die App zu und das Handy gesperrt ist.", "bg": "За да пристигат новите указания веднага – дори когато приложението е затворено и телефонът е заключен."}, "p": [{"de": "Nach dem Anmelden erscheint dieser Hinweis.", "bg": "След влизане се появява това съобщение."}, {"de": "„Einschalten“ tippen. Das Handy fragt dann, ob die App Benachrichtigungen senden darf → „Zulassen“ tippen (iPhone: „Erlauben“).", "bg": "Натисни „Включи“. Телефонът пита дали приложението може да изпраща известия → натисни „Разрешаване“ (iPhone: „Разреши“)."}, {"de": "„Später“: Der Hinweis kommt in einer Woche wieder. Einschalten geht jederzeit unter „Ich“.", "bg": "„По-късно“: съобщението ще се появи пак след седмица. Можеш да ги включиш по всяко време в „Аз“."}]}, {"id": "s02b", "bild": "push_ich", "t": {"de": "Eingeschaltet – einmal testen", "bg": "Включени – тествай веднъж"}, "p": [{"de": "Unter „Ich“ steht jetzt: „✓ Auf diesem Handy eingeschaltet“.", "bg": "В „Аз“ вече пише: „✓ Включени на този телефон“."}, {"de": "„Test senden“ tippen und die App schließen (nach oben wischen).", "bg": "Натисни „Изпрати тест“ и затвори приложението (плъзни нагоре)."}, {"de": "Nach ein paar Sekunden kommt die Mitteilung „Test“ aufs Handy.", "bg": "След няколко секунди на телефона идва известие „Тест“."}, {"de": "„Ausschalten“ nur, wenn du auf diesem Handy keine Mitteilungen willst.", "bg": "„Изключи“ – само ако не искаш изв Mehrstunden.", "bg": "Часове този месец, норма и извънредни часове."}]}, {"id": "s43", "bild": "ich_stunden", "t": {"de": "Stunden und Zeitausgleich", "bg": "Часове и компенсация с почивка"}, "p": [{"de": "Jeder Monat: gearbeitet, Soll, Plus oder Minus.", "bg": "Всеки месец: изработено, норма, плюс или минус."}, {"de": "Zeitausgleich: freie, genehmigte und beantragte Stunden.", "bg": "Компенсация с почивка: свободни, одобрени и заявени часове."}, {"de": "Einen freien Tag aus deinen Mehrstunden beantragen.", "bg": "Заяви свободен ден от извънредните си часове."}]}, {"id": "s44", "bild": "ich_zeiten", "t": {"de": "Meine Arbeitszeiten", "bg": "Моето работно време"}, "p": [{"de": "Zeit vergessen? „+ Zeit nachtragen“.", "bg": "Забравила си време? „+ Добави време“."}, {"de": "„Ändern“ – möglich, bis der Monat abgerechnet ist.", "bg": "„Промени“ – възможно, докато месецът не е отчетен."}, {"de": "„abgerechnet“: der Lohnzettel ist da. Änderungen nur noch über Rene.", "bg": "„отчетено“: фишът за заплата е издаден. Промени само чрез Rene."}]}, {"id": "s45", "bild": "ich_zeit_nachtragen", "t": {"de": "Zeit nachtragen", "bg": "Добави време"}, "p": [{"de": "Datum.", "bg": "Дата."}, {"de": "Beginn, Ende und Pause in Minuten.", "bg": "Начало, край и почивка в минути."}, {"de": "„Speichern“.", "bg": "„Запази“."}]}, {"id": "s46", "bild": "ich_urlaub", "t": {"de": "Urlaub", "bg": "Отпуск"}, "p": [{"de": "Resturlaub, genommen, genehmigt.", "bg": "Оставащ отпуск, използван, одобрен."}, {"de": "„Urlaub beantragen“.", "bg": "„Заяви отпуск“."}, {"de": "Deine Anträge – offen oder genehmigt, mit Antwort.", "bg": "Твоите заявления – чакащи или одобрени, с отговор."}]}, {"id": "s47", "bild": "ich_urlaub_antrag", "t": {"de": "Urlaub beantragen", "bg": "Заяви отпуск"}, "p": [{"de": "Von.", "bg": "От."}, {"de": "Bis.", "bg": "До."}, {"de": "„Antrag senden“ – Rene bestätigt den Antrag, die Antwort siehst du hier.", "bg": "„Изпрати заявлението“ – Rene го потвърждава, отговора виждаш тук."}]}, {"id": "s48", "bild": "ich_dokumente", "t": {"de": "Vertrag und Lohnzettel", "bg": "Договор и фишове"}, "p": [{"de": "Mein Vertrag.", "bg": "Моят договор."}, {"de": "Lohnzettel – neue kommen automatisch dazu.", "bg": "Фишове за заплата – новите се добавят автоматично."}], "tipp": {"de": "Deine Dokumente siehst nur du.", "bg": "Твоите документи виждаш само ти."}}, {"id": "s48b", "bild": "ich_konto", "t": {"de": "Benachrichtigungen, PIN, Abmelden, Sprache", "bg": "Известия, PIN, изход, език"}, "p": [{"de": "Benachrichtigungen: eingeschaltet oder nicht – einschalten, testen, ausschalten (Kapitel 1).", "bg": "Известия: включени или не – включи, тествай, изключи (глава 1)."}, {"de": "„PIN ändern“.", "bg": "„Смени PIN“."}, {"de": "„Abmelden“.", "bg": "„Изход“."}, {"de": "Sprache wechseln.", "bg": "Смени езика."}]}, {"id": "s49", "bild": "urlaub_tag", "t": {"de": "Im Urlaub", "bg": "В отпуск"}, "p": [{"de": "Im Urlaub zeigt die App „Schönen Urlaub“. Arbeit starten geht dann nicht.", "bg": "В отпуск приложението показва „Приятна почивка“. Тогава не можеш да започнеш работа."}, {"de": "Letzter Urlaubstag, wann du wieder im Einsatz bist und wie viele Tage noch.", "bg": "Последен ден от отпуска, кога отново работиш и колко дни остават."}], "tipp": {"de": "„Ich“ bleibt offen – z. B. für Lohnzettel und Urlaub.", "bg": "„Аз“ остава достъпно – напр. за фишове и отпуск."}}]}, {"id": "k12", "t": {"de": "Ideen und Verbesserungen", "bg": "Идеи и подобрения"}, "steps": [{"id": "s50", "bild": "idee_knopf", "t": {"de": "Idee oder Verbesserung schicken", "bg": "Изпрати идея или подобрение"}, "i": {"de": "Stört dich etwas in der App, ist etwas umständlich oder hättest du es gern anders? Sag es uns – direkt aus der App.", "bg": "Пречи ли ти нещо в приложението, сложно ли е нещо или би искала да е различно? Кажи ни – направо от приложението."}, "p": [{"de": "„💡 Idee“ – oben rechts, auf jeder Seite.", "bg": "„💡 Идея“ – горе вдясно, на всяка страница."}]}, {"id": "s51", "bild": "idee_fenster", "t": {"de": "Was können wir besser machen?", "bg": "Какво можем да направим по-добре?"}, "p": [{"de": "Wo in der App? Die Seite, auf der du gerade warst, ist schon gewählt.", "bg": "Къде в приложението? Страницата, на която беше, вече е избрана."}, {"de": "Bildschirmfoto auswählen (bis zu 3). So machst du eines: iPhone – Seitentaste und Lauter-Taste gleichzeitig, Android – Ein/Aus-Taste und Leiser-Taste gleichzeitig.", "bg": "Избери снимка на екрана (до 3). Така се прави: iPhone – страничния бутон и бутона за усилване едновременно, Android – бутона за включване и бутона за намаляване едновременно."}, {"de": "Das Bildschirmfoto. Mit × ist es wieder weg.", "bg": "Снимката на екрана. С × я махаш."}, {"de": "Kurz schreiben, was stört und was besser wäre – gern in deiner Sprache.", "bg": "Напиши накратко какво пречи и какво би било по-добре – спокойно на твоя език."}]}, {"id": "s52", "bild": "idee_aufnahme", "t": {"de": "Lieber sprechen? Sprachnachricht", "bg": "Предпочиташ да говориш? Гласово съобщение"}, "p": [{"de": "„🎤 Sprachnachricht aufnehmen“ tippen und einfach sprechen. Die Zeit läuft mit – höchstens 3 Minuten.", "bg": "Натисни „🎤 Запиши гласово съобщение“ и просто говори. Времето тече – най-много 3 минути."}, {"de": "„■ Stopp“, wenn du fertig bist.", "bg": "„■ Стоп“, когато приключиш."}], "tipp": {"de": "Beim ersten Mal fragt das Handy, ob die App das Mikrofon benutzen darf – bitte „Erlauben“ tippen.", "bg": "Първия път телефонът пита дали приложението може да ползва микрофона – моля, натисни „Разреши“."}}, {"id": "s53", "bild": "idee_senden", "t": {"de": "Anhören und senden", "bg": "Чуй и изпрати"}, "p": [{"de": "Mit ▶ anhören. 🗑 löscht die Aufnahme.", "bg": "Чуй с ▶. 🗑 изтрива записа."}, {"de": "„🎤 Neu aufnehmen“, wenn du es nochmal sagen willst.", "bg": "„🎤 Запиши отново“, ако искаш да го кажеш пак."}, {"de": "„Senden“ – Rene bekommt alles auf Deutsch übersetzt.", "bg": "„Изпрати“ – Rene получава всичко преведено на немски."}]}, {"id": "s54", "bild": "idee_antwort", "t": {"de": "Rene hat geantwortet", "bg": "Rene отговори"}, "p": [{"de": "Seine Antwort steht oben unter „Ich“ – in deiner Sprache.", "bg": "Отговорът му стои горе в „Аз“ – на твоя език."}, {"de": "„✓ Gelesen“ – dann verschwindet der Hinweis oben.", "bg": "„✓ Прочетох“ – тогава съобщението горе изчезва."}, {"de": "Alles findest du unter „Ich“. Gibt es etwas Neues, steht am Reiter eine Zahl.", "bg": "Всичко намираш в „Аз“. Ако има нещо ново, на раздела стои число."}]}, {"id": "s55", "bild": "idee_liste", "t": {"de": "Meine Ideen", "bg": "Моите идеи"}, "p": [{"de": "Noch eine Idee? Auch hier geht es los.", "bg": "Още една идея? Можеш да започнеш и оттук."}, {"de": "Deine Ideen mit Datum und Seite – 📷 = Bildschirmfotos, 🎤 = Sprachnachricht.", "bg": "Твоите идеи с дата и страница – 📷 = снимки на екрана, 🎤 = гласово съобщение."}, {"de": "Der Stand: Angekommen, Gelesen, Geplant, Umgesetzt oder Nicht geplant.", "bg": "Състоянието: Получена, Прочетена, Планирана, Направена или Не е планирана."}, {"de": "Renes Antwort. „Neu“ = noch nicht gelesen.", "bg": "Отговорът на Rene. „Ново“ = още не е прочетен."}]}]}, {"id": "k11", "t": {"de": "Gut zu wissen", "bg": "Добре е да знаеш"}, "text": [{"de": "Erst „✓ Fertig“, dann das nächste Apartment.", "bg": "Първо „✓ Готово“, после следващият апартамент."}, {"de": "Arbeitet ihr zu zweit im selben Apartment? Jede tippt das Apartment selbst an. „Mit dir: …“ zeigt, wer dabei ist.", "bg": "Работите ли двете в един апартамент? Всяка натиска апартамента сама. „С теб: …“ показва кой е там."}, {"de": "Keine Verbindung? Kurz warten und nochmal tippen. Fotos bleiben in der App, bis sie hochgeladen sind.", "bg": "Няма връзка? Изчакай малко и натисни пак. Снимките остават в приложението, докато не се качат."}, {"de": "Die App aktualisiert sich von selbst – du musst nichts tun.", "bg": "Приложението се обновява само – не е нужно да правиш нищо."}, {"de": "Leere Flaschen oder Packungen? „🧴 Material leer / verbraucht“ – zählen musst du nicht.", "     var first = SEITEN.findIndex(function (x) { return x.ki === ki; }), n = (k.steps || []).length;
    return '<button type="button" data-go="' + first + '"><span class="kn">' + (ki + 1) + '</span><span class="kt">' + esc(tx(k.t)) + '</span><span class="kc">' + (n ? n + ' ' + esc(u('steps')) : esc(u('text'))) + '</span></button>';
  }).join('') + '</section></div>';
  el('main').innerHTML = h;
  el('los').onclick = function () { zeige(0); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function (b) { b.onclick = function () { zeige(+b.getAttribute('data-go')); }; });
}
function renderStep() {
  var S = SEITEN[POS], s = S.s, k = S.k, total = SEITEN.length;
  el('nav').hidden = false;
  var h = '<article class="step"><header class="head"><div class="eyebrow">' + esc(u('chap')) + ' ' + (S.ki + 1) + ' · ' + esc(tx(k.t)) + '</div><h2>' + esc(tx(s.t)) + '</h2>' +
    '<div class="prog"><span>' + esc(u('step').replace('{n}', POS + 1).replace('{m}', total)) + '</span><span class="bar"><i style="width:' + ((POS + 1) / total * 100).toFixed(1) + '%"></i></span></div></header>';
  if (s.text) {
    h += '<div class="textpage">' + s.text.map(function (t) { return '<div class="it"><span>' + esc(tx(t)) + '</span></div>'; }).join('') + '</div>';
  } else {
    var M = marks(s);
    h += '<div class="body"><div class="shotwrap"><div class="phone" id="phone"><div class="screen" id="screen"><img id="shot" alt="" src="' + bild(s) + '">' +
      M.map(function (m) { return '<button type="button" class="mk" data-m="' + m.n + '" aria-label="' + m.n + '" style="left:clamp(3px, calc(' + (m.x / 390 * 100).toFixed(2) + '% - 9px), calc(100% - 29px));top:clamp(3px, calc(' + (m.y / 844 * 100).toFixed(2) + '% - 9px), calc(100% - 29px))">' + m.n + '</button>'; }).join('') +
      '<div class="spot" id="spot" hidden></div></div></div></div><div class="txt" style="display:grid;gap:14px;min-width:0">' +
      (s.i ? '<p class="lead">' + esc(tx(s.i)) + '</p>' : '') +
      '<ol class="pts">' + s.p.map(function (p, i) { return '<li tabindex="0" data-p="' + (i + 1) + '"><span class="n">' + (i + 1) + '</span><span>' + esc(tx(p)) + '</span></li>'; }).join('') + '</ol>' +
      (s.tipp ? '<div class="tip"><b>' + esc(u('tip')) + '</b><span>' + esc(tx(s.tipp)) + '</span></div>' : '') +
      (POS === 0 ? '<p class="hint">' + esc(u('hint')) + '</p>' : '') + '</div></div>';
  }
  h += '</article>';
  el('main').innerHTML = h;
  el('prev').textContent = '‹ ' + u('prev'); el('prev').disabled = POS <= 0;
  el('next').textContent = POS >= total - 1 ? u('done') : u('next') + ' ›';
  el('toc').textContent = u('toc');
  AKTIV = 0;
  if (!s.text) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-m]'), function (b) { b.onclick = function (e) { e.stopPropagation(); aktiv(+b.getAttribute('data-m'), true); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-p]'), function (li) {
      li.onclick = function () { aktiv(+li.getAttribute('data-p'), false); };
      li.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); aktiv(+li.getAttribute('data-p'), false); } };
    });
    el('screen').onclick = function () { gross(); };
    wisch(el('phone'));
    vorladen();
  }
}
function aktiv(n, vomBild) {
  var S = SEITEN[POS], M = marks(S.s), m = M.filter(function (x) { return x.n === n; })[0], sp = el('spot');
  AKTIV = AKTIV === n ? 0 : n;
  Array.prototype.forEach.call(document.querySelectorAll('[data-m]'), function (b) { b.classList.toggle('on', +b.getAttribute('data-m') === AKTIV); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-p]'), function (li) { li.classList.toggle('on', +li.getAttribute('data-p') === AKTIV); });
  if (!AKTIV || !m) { sp.hidden = true; return; }
  sp.hidden = false; sp.style.left = (m.x / 390 * 100) + '%'; sp.style.top = (m.y / 844 * 100) + '%'; sp.style.width = (m.w / 390 * 100) + '%'; sp.style.height = (m.h / 844 * 100) + '%';
  if (vomBild) { var li = document.querySelector('[data-p="' + n + '"]'); if (li && li.scrollIntoView) li.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  else if (window.innerWidth < 900) { var ph = el('phone'); var r = ph.getBoundingClientRect(); if (r.top < 60 || r.bottom > window.innerHeight) ph.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
}
function gross() {
  var S = SEITEN[POS]; if (!S || S.s.text) return;
  var z = document.createElement('div'); z.className = 'zoom';
  z.innerHTML = '<div class="z"><img alt="" src="' + bild(S.s) + '"></div><button type="button" class="x">' + esc(u('close')) + '</button>';
  z.onclick = function () { z.remove(); };
  document.body.appendChild(z);
  z.querySelector('.x').focus();
}
function wisch(node) {
  var x0 = null, y0 = 0;
  node.addEventListener('touchstart', function (e) { var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
  node.addEventListener('touchend', function (e) { if (x0 == null) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { e.preventDefault(); if (dx < 0) weiter(); else zurueck(); } });
}
function vorladen() { [POS - 1, POS + 1, POS + 2].forEach(function (i) { var S = SEITEN[i]; if (S && !S.s.text) { var im = new Image(); im.src = bild(S.s); } }); }
function render() { if (POS < 0) renderStart(); else renderStep(); }
function zeige(i) {
  POS = Math.max(-1, Math.min(SEITEN.length - 1, i));
  var id = POS < 0 ? '' : SEITEN[POS].s.id;
  try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (e) {}
  try { localStorage.setItem('anl_pos', id); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function weiter() { if (POS >= SEITEN.length - 1) zeige(-1); else zeige(POS + 1); }
function zurueck() { if (POS > 0) zeige(POS - 1); }
el('next').onclick = weiter; el('prev').onclick = zurueck; el('toc').onclick = function () { zeige(-1); };
el('home').onclick = function () { zeige(-1); };
Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) { b.onclick = function () { setLang(b.getAttribute('data-l')); }; });
document.addEventListener('keydown', function (e) {
  if (document.querySelector('.zoom')) { if (e.key === 'Escape') document.querySelector('.zoom').remove(); return; }
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') weiter(); else if (e.key === 'ArrowLeft') zurueck();
});
window.addEventListener('hashchange', function () { var h = location.hash.slice(1), i = SEITEN.findIndex(function (x) { return x.s.id === h; }); if (i >= 0 && i !== POS) { POS = i; render(); } });
el('logo').src = LOGO;
(function () { var h = location.hash.slice(1), i = SEITEN.findIndex(function (x) { return x.s.id === h; }); POS = i >= 0 ? i : -1; setLang(L); })();
</script>
