<style>
:root{
  color-scheme:light;
  /* CI Premium Apartments Seekirchen (Masterinstruktionen 28.09.2026) */
  --ci-greige:#DBD7D3; --ci-greige2:#C1BCB6; --ci-taupe:#7E715E; --ci-black:#2B2B2A;
  --ground:var(--ci-greige2); --cream:var(--ci-greige); --paper:#FFFFFF; --line:#D6D1CB; --ink:var(--ci-black); --muted:#5C5852;
  --gold:var(--ci-taupe); --fill:var(--ci-black); --onfill:#FFFFFF; --lakebg:#F0EDEA;
  --ok:#4F7A52; --okbg:#EAF2E8; --warn:#96590F; --warnbg:#FBF1E2; --err:#A1402F; --errbg:#F8E7E3;
  --shadow:0 1px 2px rgba(43,43,42,.05),0 6px 18px rgba(43,43,42,.06);
  /* Schriften laut CI: Playfair Display Bold · DIN OT Condensed (Ersatz: DIN Condensed / Roboto Condensed – Abweichung, bis die Lizenzschrift eingebettet ist) · Helvetica Neue */
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --cond:'DIN OT Condensed','DINOT-Cond','DIN Condensed','Roboto Condensed','Arial Narrow',sans-serif-condensed,sans-serif;
  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--ground:#1E1D1B;--cream:#262523;--paper:#302E2B;--line:#45423E;--ink:#ECE9E5;--muted:#B5AFA7;--gold:#C4B8A6;--fill:#DBD7D3;--onfill:#2B2B2A;--lakebg:#3A3632;
  --ok:#8DC08F;--okbg:#1E2A1F;--warn:#E3AE62;--warnbg:#2E2415;--err:#E28A77;--errbg:#321D18;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance}
[hidden]{display:none!important}
.shell{max-width:560px;margin:0 auto;background:var(--cream);min-height:100vh;box-shadow:0 0 0 1px var(--line)}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px}
.top img{height:38px;width:auto;display:block}
.top .wer{margin-left:auto;text-align:right;font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--gold);line-height:1.3}
.top .wer b{display:block;color:var(--ink);font-size:13px;letter-spacing:.04em}
main{padding:16px 16px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.lbl{font-family:var(--cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.sec .lbl{color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.neu{border-left:4px solid var(--ink)}
.big{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.15}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--fill);border-color:var(--fill);color:var(--onfill)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:12.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-family:var(--cond);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.tag.warn{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.tag.err{border-color:var(--err);color:var(--err);background:var(--errbg)}
.tag.dark{background:var(--fill);border-color:var(--fill);color:var(--onfill)}
.tag.test{border:2px solid var(--warn);color:var(--warn);background:var(--warnbg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.geld{font-family:var(--serif);font-weight:700;font-size:20px}
.wunsch{background:var(--lakebg);padding:8px 12px;font-size:14px}
.posten{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.posten li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0;font-size:15px}
.posten li b{font-family:var(--serif);font-size:18px}
.leer{text-align:center;color:var(--muted);padding:26px 12px;font-size:14.5px}
.demo{background:var(--warnbg);border:1px solid var(--warn);color:var(--ink);padding:8px 12px;font-size:13px}
.hinweis{background:var(--lakebg);border-left:3px solid var(--gold);padding:8px 12px;font-size:13.5px;color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
nav button{border:0;background:transparent;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-family:var(--cond);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;position:relative}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--ink)}
nav svg{width:23px;height:23px}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;background:var(--err);color:#fff;border-radius:9px;font-size:11px;line-height:18px;font-family:var(--sans);letter-spacing:0}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:18px;text-align:center}
.login img{height:64px;width:auto}
.pin{display:flex;gap:8px;justify-content:center}
.pin input{width:46px;height:56px;text-align:center;font-family:var(--serif);font-size:26px;border:1px solid var(--line);background:var(--paper)}
.pin input:focus{outline:2px solid var(--ink);outline-offset:0}
.feld{display:flex;flex-direction:column;gap:5px;text-align:left;font-size:13px;color:var(--muted)}
.feld input,.feld select,.feld textarea{border:1px solid var(--line);background:var(--paper);padding:10px 12px;font-size:16px;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--ink);background:var(--paper);padding:8px 12px;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fill);color:var(--onfill)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:var(--fill);color:var(--onfill);padding:11px 18px;font-size:14.5px;max-width:calc(100% - 32px);z-index:9;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--err);color:#fff}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--lakebg);padding:8px 10px;overflow-wrap:anywhere;user-select:all}
details.res{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px}
details.res>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--ink)}
details.res>summary::-webkit-details-marker{display:none}
details.res>summary::after{content:"+";font-size:20px;line-height:1;color:var(--muted)}
details.res[open]>summary::after{content:"–"}
.resin{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.banner{background:var(--paper);border:1px solid var(--ink);border-left-width:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.banner b{font-family:var(--serif);font-size:17px;line-height:1.2}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
a{color:inherit}
</style>
</head>

  function tg(n){var d=new Date(h.getFullYear(),h.getMonth(),h.getDate()+n);return ['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'}

function login(){var pin=pinWert();if(pin.length!==6){toast('Bitte 6 Ziffern eingeben',true);return}
  var b=$('#loginBtn');if(b){b.disabled=true;b.textContent='Anmelden …'}
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'login',t:TOK,pin:pin})}).then(function(r){return r.json()}).then(function(j){
    if(!j||!j.ok){toast((j&&j.fehler)||'Anmeldung fehlgeschlagen',true);document.querySelectorAll('[data-pi]').forEach(function(i){i.value=''});var f=document.querySelector('[data-pi="0"]');if(f)f.focus();if(b){b.disabled=false;b.textContent='Anmelden'}return}
    S.s=j.s;store('pp_s_'+TOK,j.s);laden()}).catch(function(){toast('Keine Verbindung – bitte nochmal',true);if(b){b.disabled=false;b.textContent='Anmelden'}})}
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.pi!=null){t.value=t.value.replace(/\D/g,'').slice(-1);if(t.value){var n=document.querySelector('[data-pi="'+(+t.dataset.pi+1)+'"]');if(n)n.focus();else if(pinWert().length===6)login()}}
  if(t.id==='grundTxt'){S.grundTxt=t.value}});
document.addEventListener('keydown',function(e){var t=e.target;if(t.dataset&&t.dataset.pi!=null&&e.key==='Backspace'&&!t.value){var p=document.querySelector('[data-pi="'+(+t.dataset.pi-1)+'"]');if(p){p.focus();p.value=''}}
  if(t.dataset&&t.dataset.pi!=null&&e.key==='Enter')login()});
document.addEventListener('paste',function(e){var t=e.target;if(!(t.dataset&&t.dataset.pi!=null))return;var v=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\D/g,'').slice(0,6);if(v.length<2)return;e.preventDefault();
  document.querySelectorAll('[data-pi]').forEach(function(i,k){i.value=v[k]||''});if(v.length===6)login()});
document.addEventListener('click',function(e){var t=e.target.closest('button,[data-tab]');if(!t)return;var D=S.d;
  if(t.id==='loginBtn'){login();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;S.ab='';render();window.scrollTo(0,0);return}
  if(t.dataset.ja){t.disabled=true;call({a:'antwort',id:t.dataset.ja,ja:true},function(j){if(j){S.d=j;toast(j.meldung||'Zugesagt')}render()});return}
  if(t.dataset.ab){S.ab=t.dataset.ab;S.grund='';S.grundTxt='';render();return}
  if(t.dataset.abbr!=null){S.ab='';render();return}
  if(t.dataset.grund){S.grund=S.grund===t.dataset.grund?'':t.dataset.grund;render();return}
  if(t.dataset.nein){var g=(S.grundTxt||'').trim()||S.grund;t.disabled=true;call({a:'antwort',id:t.dataset.nein,ja:false,grund:g},function(j){if(j){S.d=j;S.ab='';toast(j.meldung||'Abgesagt')}render()});return}
  if(t.dataset.sammel){t.disabled=true;call({a:'sammel_ok',datum:t.dataset.sammel,test:t.dataset.stest==='1'},function(j){if(j){S.d=j;toast(j.meldung||'Bestätigt')}render()});return}
  if(t.dataset.wpan!=null){wpAktivieren();return}
  if(t.dataset.wpaus!=null){wpAus();return}
  if(t.dataset.wptest!=null){wpTest();return}
  if(t.dataset.wpspaeter!=null){store('pp_wpb',String(Date.now()));render();return}
  if(t.dataset.test!=null){call({a:'test'},function(j){if(j)toast(j.meldung||'Gesendet')});return}
  if(t.dataset.kopie!=null){var tx=(D&&D.ntfy)||'';try{navigator.clipboard.writeText(tx).then(function(){toast('Kopiert')},function(){sel()})}catch(x){sel()}
    function sel(){var el=$('#topic');if(!el)return;var r=document.createRange();r.selectNodeContents(el);var s2=window.getSelection();s2.removeAllRanges();s2.addRange(r);toast('Markiert – jetzt kopieren')}return}
  if(t.dataset.pin1!=null){S.pinNeu=true;render();return}
  if(t.dataset.pin0!=null){S.pinNeu=false;render();return}
  if(t.dataset.pinok!=null){var a1=$('#pAlt').value,n1=$('#pNeu').value,n2=$('#pNeu2').value;if(!/^\d{6}$/.test(n1)){toast('Neue PIN: genau 6 Ziffern',true);return}if(n1!==n2){toast('Die neuen PINs stimmen nicht überein',true);return}
    call({a:'pin',alt:a1,neu:n1},function(j){if(j){S.pinNeu=false;toast(j.meldung||'PIN geändert');render()}});return}
  if(t.dataset.raus!=null){if(!DEMO){call({a:'abmelden',dev:DEVID},function(){});if(wpKann()){store('pp_wpoff','1');try{navigator.serviceWorker.getRegistration().then(function(reg){return reg&&reg.pushManager.getSubscription()}).then(function(sub){return sub&&sub.unsubscribe()}).catch(function(){})}catch(x){}}}S.s='';S.d=null;S.wpPruef=false;store('pp_s_'+TOK,null);render();return}
});
// Aktualisieren: beim Zurückkehren in die App sofort, sonst alle 2 Minuten – aber nur, solange jemand die App bedient (nach 20 Min. Ruhe Pause, Push-Nachrichten melden Neues)
var AKTIV=Date.now();['pointerdown','keydown','touchstart','scroll'].forEach(function(ev){document.addEventListener(ev,function(){AKTIV=Date.now()},{passive:true})});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){AKTIV=Date.now();if(S.s&&!S.busy)laden(true)}});
setInterval(function(){if(document.visibilityState==='visible'&&Date.now()-AKTIV<20*60000&&S.s&&!S.busy&&!S.ab&&!S.pinNeu)laden(true)},120000);
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='reserve')S.resOpen=e.target.open},true);
if(PAGES){try{navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});
  navigator.serviceWorker.addEventListener('message',function(e){var m=e.data;if(m&&m.t==='push'&&S.s&&!S.busy&&!S.ab&&!S.pinNeu)laden(true)})}catch(x){/* z. B. in der alten n8n-Seite nicht erlaubt */}}
if(DEMO){S.d=demoDaten();render()}else if(S.s)laden();else render();
})();
</script>
</body>
</html>
