<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C1BCB6">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Premium Club · Premium Apartments Seekirchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  /* CI Premium Apartments Seekirchen (Masterinstruktionen 28.09.2026): Greige #DBD7D3 / #C1BCB6 · Taupe #7E715E (sparsam, nur auf Weiß für kleine Schrift) · Schwarz #2B2B2A · Gold nur im Original-Logo */
  --ci-greige:#DBD7D3; --ci-greige2:#C1BCB6; --ci-taupe:#7E715E; --ci-black:#2B2B2A;
  --ground:var(--ci-greige2); --cream:var(--ci-greige); --paper:#FFFFFF; --line:#D6D1CB; --ink:var(--ci-black); --muted:#5C5852;
  --gold:var(--ci-taupe); --fill:var(--ci-black); --onfill:#FFFFFF; --lakebg:#F0EDEA;
  --ok:#4F7A52; --okbg:#EAF2E8; --warn:#96590F; --warnbg:#FBF1E2; --err:#A1402F; --errbg:#F8E7E3;
  --shadow:0 1px 2px rgba(43,43,42,.05),0 6px 18px rgba(43,43,42,.06);
  /* Statusfarben (Stufen): Standard weiß · Silber Greige · Gold = Schwarz mit Taupe-Akzent (Gold ist laut CI nur im Logo erlaubt) */
  --h-bg:#FFFFFF; --h-fg:#2B2B2A; --h-mut:#5C5852; --h-bar:#2B2B2A; --h-track:#E7E3DE; --h-accent:#7E715E; --h-line:#D6D1CB;
  /* Schriften laut CI: Playfair Display Bold · DIN OT Condensed (Ersatz: DIN Condensed / Roboto Condensed – Abweichung, bis die Lizenzschrift eingebettet ist) · Helvetica Neue */
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --cond:'DIN OT Condensed','DINOT-Cond','DIN Condensed','Roboto Condensed','Arial Narrow',sans-serif-condensed,sans-serif;
  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--ground:#1E1D1B;--cream:#262523;--paper:#302E2B;--line:#45423E;--ink:#ECE9E5;--muted:#B5AFA7;--gold:#C4B8A6;--fill:#DBD7D3;--onfill:#2B2B2A;--lakebg:#3A3632;
  --ok:#8DC08F;--okbg:#1E2A1F;--warn:#E3AE62;--warnbg:#2E2415;--err:#E28A77;--errbg:#321D18;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --h-bg:#302E2B;--h-fg:#ECE9E5;--h-mut:#B5AFA7;--h-bar:#DBD7D3;--h-track:#45423E;--h-accent:#C4B8A6;--h-line:#45423E}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
a{color:inherit}
.shell{max-width:560px;margin:0 auto;background:var(--cream);min-height:100vh;box-shadow:0 0 0 1px var(--line)}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px}
.top img{height:36px;width:auto;display:block}
.top .wer{margin-left:auto;text-align:right;font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--gold);line-height:1.3;min-width:0}
.top .wer b{display:block;color:var(--ink);font-size:13px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:16px 16px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.lbl{font-family:var(--cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.sec .lbl{color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.neu{border-left:4px solid var(--ink)}
.card.klein{padding:12px 14px;gap:6px}
.big{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.15}
.zahl{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.klein-t{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--fill);border-color:var(--fill);color:var(--onfill)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.warn{border-color:var(--err);color:var(--err)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:12.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tag{display:inline-block;font-family:var(--cond);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.tag.warn{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.tag.err{border-color:var(--err);color:var(--err);background:var(--errbg)}
.tag.dark{background:var(--fill);border-color:var(--fill);color:var(--onfill)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.geld{font-family:var(--serif);font-weight:700;font-size:20px}
.wunsch{background:var(--lakebg);padding:8px 12px;font-size:14px}
.posten{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0}
.posten li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0;font-size:14.5px}
.posten li:last-child{border-bottom:0}
.posten li b{font-family:var(--serif);font-size:16px;white-space:nowrap}
.leer{text-align:center;color:var(--muted);padding:22px 12px;font-size:14.5px}
.demo{background:var(--warnbg);border:1px solid var(--warn);color:var(--ink);padding:8px 12px;font-size:13px}
.hinweis{background:var(--lakebg);border-left:3px solid var(--gold);padding:8px 12px;font-size:13.5px;color:var(--ink)}
.hinweis.err{border-left-color:var(--err);background:var(--errbg)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav button{border:0;background:transparent;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-family:var(--cond);font-weight:700;font-size:10.5px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;position:relative;min-width:0}
nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--ink)}
nav svg{width:23px;height:23px}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;background:var(--err);color:#fff;border-radius:9px;font-size:11px;line-height:18px;font-family:var(--sans);letter-spacing:0}
.pub{min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--cream);box-shadow:0 0 0 1px var(--line)}
.pub .logo{height:54px;width:auto;align-self:flex-start}
.feld{display:flex;flex-direction:column;gap:5px;text-align:left;font-size:13px;color:var(--muted);min-width:0}
.feld input,.feld select,.feld textarea{border:1px solid var(--line);background:var(--paper);padding:10px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
.feld textarea{min-height:76px;resize:vertical}
.feld input:focus,.feld select:focus,.feld textarea:focus{outline:2px solid var(--ink);outline-offset:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink);line-height:1.4}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--ink)}
.seg{display:flex;border:1px solid var(--ink);background:var(--paper)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;cursor:pointer;color:var(--ink);min-width:0}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--fill);color:var(--onfill)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:var(--fill);color:var(--onfill);padding:11px 18px;font-size:14.5px;max-width:calc(100% - 32px);z-index:20;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--err);color:#fff}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:var(--lakebg);padding:8px 10px;overflow-wrap:anywhere;user-select:all;letter-spacing:.04em}
.banner{background:var(--paper);border:1px solid var(--ink);border-left-width:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.banner b{font-family:var(--serif);font-size:17px;line-height:1.2}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* Status-Karte: Optik wechselt mit der Stufe */
.hero{background:var(--h-bg);color:var(--h-fg);border:1px solid var(--h-line);box-shadow:var(--shadow);padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .lbl{color:var(--h-accent)}
.hero .stufe{font-family:var(--serif);font-weight:700;font-size:38px;line-height:1.05}
.hero .sub{color:var(--h-mut);font-size:14px}
.hero::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--h-accent)}
[data-stufe="silber"]{--h-bg:#C1BCB6;--h-fg:#2B2B2A;--h-mut:#4A4640;--h-bar:#2B2B2A;--h-track:rgba(255,255,255,.55);--h-accent:#2B2B2A;--h-line:#B2ACA5}
[data-stufe="silber"] .hero{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 2px,transparent 2px 9px)}
[data-stufe="gold"]{--h-bg:#2B2B2A;--h-fg:#F3F0EC;--h-mut:#C1BCB6;--h-bar:#DBD7D3;--h-track:#4A4742;--h-accent:#C1BCB6;--h-line:#7E715E}
[data-stufe="gold"] .hero{background-image:linear-gradient(135deg,rgba(126,113,94,.35),transparent 55%)}
[data-stufe="gold"] .hero::before{background:#7E715E;height:6px}
.bar{height:12px;background:var(--h-track);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--h-bar);display:block}
.mini{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--h-mut)}
.mini .bar{height:5px}
.mini b{color:var(--h-fg);font-weight:600}
.chip-st{display:inline-flex;align-items:center;gap:6px;font-family:var(--cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px;padding:2px 9px;background:var(--h-bg);color:var(--h-fg);border:1px solid var(--h-line)}
.top .chip-st{background:var(--fill);color:var(--onfill);border-color:var(--fill)}
[data-stufe="silber"] .top .chip-st{background:#C1BCB6;color:#2B2B2A;border-color:#B2ACA5}
[data-stufe="gold"] .top .chip-st{background:#7E715E;color:#fff;border-color:#7E715E}
.praemie{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.praemie .pt{font-family:var(--serif);font-weight:700;font-size:19px;white-space:nowrap;text-align:right}
.praemie.sperr{opacity:.62}
.verlauf{display:flex;flex-direction:column}
.verlauf .z{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.verlauf .z:last-child{border-bottom:0}
.verlauf .z b{font-family:var(--serif);font-size:17px;text-align:right;white-space:nowrap}
.verlauf .z b.minus{color:var(--err)}
.verlauf .z small{color:var(--muted);font-size:12.5px}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(43,43,42,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;border-top:3px solid var(--ink)}
.proj-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.proj-h h3{font-size:19px;line-height:1.2}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--muted);text-align:left;padding:4px 6px 4px 0;border-bottom:1px solid var(--ink)}
.tbl td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.scroll-x{overflow-x:auto}
.codebox{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--ink);padding:10px 12px;background:var(--paper)}
.codebox .cd{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:20px;letter-spacing:.08em}
.zurueck{border:0;background:transparent;padding:0;font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px;color:var(--muted);cursor:pointer;align-self:flex-start;min-height:30px}
@media (max-width:370px){.zahl{font-size:30px}.hero .stufe{font-size:32px}.two{grid-template-columns:1fr}}

/* Öffentliche Seiten */
.pub-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg.sm{width:auto}
.seg.sm button{flex:none;padding:5px 11px;font-size:12px}
.fuss{margin-top:auto;padding-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.hero.klein{padding:14px 14px 12px;gap:8px}
.hero.klein .stufe{font-size:26px}
.hero .posten li{border-bottom-color:var(--h-line);font-size:14px}
.hero .posten li:last-child{border-bottom:0}
.hero .chip-st{background:transparent;border-color:var(--h-accent);color:var(--h-fg)}
.hero[data-stufe="silber"]{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 2px,transparent 2px 9px)}
.hero[data-stufe="gold"]{background-image:linear-gradient(135deg,rgba(126,113,94,.35),transparent 55%)}
.hero[data-stufe="gold"]::before{background:#7E715E;height:6px}

</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
/* ===== Premium Club · App · Kern: Verbindung, Sprache, Zustand, Mitteilungen, Rahmen ===== */
var API='https://reneaugustin.app.n8n.cloud/webhook/club-api';
var LOGO='https://static.wixstatic.com/media/3002bf_1b9aa96be8c64ac1928f46bd48e89ff0~mv2.png/v1/fill/w_420,h_218,al_c,q_90/logo.png';
var VER='2026-10-04.1';
var PAGES=true;
var QS=location.search+location.hash;
function qp(n){var m=new RegExp('[?&#]'+n+'=([^&#]*)','i').exec(QS);try{return m?decodeURIComponent(m[1]):''}catch(e){return ''}}
var DEMO=(function(){var m=/[?&#]demo(?:=([a-z0-9]*))?/i.exec(QS);return m?String(m[1]||'standard').toLowerCase():''})();
function store(k,v){try{if(v===undefined)return window.localStorage.getItem(k);if(v===null)window.localStorage.removeItem(k);else window.localStorage.setItem(k,v)}catch(e){return null}}
var TOK=(function(){var m=/[?&#]t=([a-f0-9]{32})(?![a-f0-9])/i.exec(QS);if(m){var t=m[1].toLowerCase();if(!DEMO)store('cl_t',t);return t}return DEMO?'':(store('cl_t')||'')})();
var DEVID=(function(){var d=store('cl_dev');if(!/^[A-Za-z0-9_-]{6,32}$/.test(d||'')){var a=new Uint8Array(12);try{(window.crypto||window.msCrypto).getRandomValues(a)}catch(e){for(var i=0;i<12;i++)a[i]=Math.floor(Math.random()*256)}d=Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');store('cl_dev',d)}return d})();
var LANG=(function(){var l=store('cl_lang');if(l==='de'||l==='en')return l;return /^en/i.test(navigator.language||'')?'en':'de'})();
function L(de,en){return LANG==='en'?en:de}
var S={d:null,mode:'lade',tab:'',sub:'einloesen',busy:0,f:{},pub:null,pr:'',ed:null,sheet:null,wpBusy:false,wpPruef:false,fehler:'',deferred:null,codeEin:null,willkommen:false,pc:null,t0:0};
var ACT={};

/* ----- Helfer ----- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nf(n,dec){try{return new Intl.NumberFormat(LANG==='en'?'en-GB':'de-AT',{minimumFractionDigits:dec||0,maximumFractionDigits:dec==null?0:dec}).format(+n||0)}catch(e){return String(Math.round(+n||0))}}
function eur(x){var r=Math.round((+x||0)*100)/100,d=Math.abs(r-Math.round(r))<0.005?0:2;return LANG==='en'?'€'+nf(r,d):nf(r,d)+'\u00a0€'}
function pts(n){return nf(Math.round(+n||0),0)}
function p2(n){return (n<10?'0':'')+n}
var MON_DE=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
var MON_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function ymd(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?{y:+m[1],m:+m[2],d:+m[3]}:null}
function dfull(s){var p=ymd(s);if(!p)return '';return LANG==='en'?p.d+' '+MON_EN[p.m-1].slice(0,3)+' '+p.y:p2(p.d)+'.'+p2(p.m)+'.'+p.y}
function dkurz(s){var p=ymd(s);if(!p)return '';return LANG==='en'?p.d+' '+MON_EN[p.m-1].slice(0,3):p2(p.d)+'.'+p2(p.m)+'.'}
function zr(von,bis){var a=ymd(von),b=ymd(bis);if(!a||!b)return dfull(von||bis);
  if(LANG==='en'){var m1=MON_EN[a.m-1].slice(0,3),m2=MON_EN[b.m-1].slice(0,3);if(a.y===b.y&&a.m===b.m)return a.d+'–'+b.d+' '+m1+' '+a.y;if(a.y===b.y)return a.d+' '+m1+' – '+b.d+' '+m2+' '+a.y;return dfull(von)+' – '+dfull(bis)}
